name: Quality and accounting
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lot_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: lot_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U lot_test -d lot_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://lot_test:disposable_ci_password@127.0.0.1:5432/lot_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
          cache: false
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test
      - run: python manage.py reconcile
      - run: go test -race ./api ./engine ./cmd/server
      - run: go vet ./api ./engine ./cmd/server
