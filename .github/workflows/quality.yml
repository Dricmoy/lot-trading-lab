name: Quality and accounting
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lot_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: lot_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U lot_test -d lot_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://lot_test:disposable_ci_password@127.0.0.1:5432/lot_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: ruff check .
      - run: cmake -S matching -B matching/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build matching/build -j 2
      - run: python matching/verify.py
      - run: server/mvnw -B -s server/maven-settings.xml -f server/pom.xml verify
      - name: Start the Java and C++ backend
        env:
          PUBLIC_APP_URL: http://127.0.0.1:8080
        run: |
          java -jar server/target/lot-server-2.0.0.jar --spring.web.resources.static-locations=file:dist/,classpath:/static/ > /tmp/lot-java.log 2>&1 &
          python scripts/wait_for_http.py http://127.0.0.1:8080/api/health
      - run: python scripts/auth_smoke.py http://127.0.0.1:8080
      - run: python scripts/replay_smoke.py http://127.0.0.1:8080
      - run: python scripts/history_sampling.py http://127.0.0.1:8080
      - run: python scripts/java_compatibility.py http://127.0.0.1:8080
      - run: python scripts/java_faults.py
      - run: java -jar server/target/lot-server-2.0.0.jar --lot.reconcile=true --server.port=0
      - name: Show server diagnostics on failure
        if: failure()
        run: tail -100 /tmp/lot-java.log || true
