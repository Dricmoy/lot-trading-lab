services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lot
      POSTGRES_USER: lot
      POSTGRES_PASSWORD: local_disposable_password
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - lot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lot -d lot"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  lot-postgres:
