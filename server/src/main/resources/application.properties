spring.application.name=lot
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16KB
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.mail.host=${EMAIL_HOST:localhost}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_HOST_USER:}
spring.mail.password=${EMAIL_HOST_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${EMAIL_USE_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
